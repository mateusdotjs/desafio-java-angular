<mat-card class="auth-card">
  <mat-card-content>
    <h1>Entrar</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field>
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        @if (fieldError('email'); as message) {
          <mat-error>{{ message }}</mat-error>
        }
      </mat-form-field>
      <mat-form-field>
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        @if (fieldError('password'); as message) {
          <mat-error>{{ message }}</mat-error>
        }
      </mat-form-field>
      <div class="actions">
        <button matButton="filled" type="submit" [disabled]="submitting()" [showProgress]="submitting()">
          Entrar
          <mat-progress-spinner progressIndicator mode="indeterminate" diameter="20" />
        </button>
        <a matButton routerLink="/register">Criar conta</a>
      </div>
    </form>
  </mat-card-content>
</mat-card>
