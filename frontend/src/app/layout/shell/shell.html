<mat-toolbar>
  <a class="brand" [routerLink]="isAuthenticated() ? '/me' : '/login'">Cadastro</a>
  <nav>
    @if (isAuthenticated()) {
      <span class="user-name">{{ user()?.name }}</span>
      <a matButton routerLink="/me" routerLinkActive="active" ariaCurrentWhenActive="page">Minha conta</a>
      @if (isAdmin()) {
        <a matButton routerLink="/users" routerLinkActive="active" ariaCurrentWhenActive="page">Usuários</a>
      }
      <button matButton type="button" (click)="logout()">Sair</button>
    } @else {
      <a matButton routerLink="/login" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Entrar</a>
      <a matButton routerLink="/register" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Criar conta</a>
    }
  </nav>
</mat-toolbar>

<main>
  <router-outlet />
</main>
